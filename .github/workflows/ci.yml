name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly re-scan with updated gitleaks rules

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          cd /tmp
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tgz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tgz}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tgz" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
      - name: Scan git history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner .
      - name: Scan working tree
        run: gitleaks dir --config .gitleaks.toml --redact --verbose --no-banner .

  public-safety:
    name: Public-safety check (no personal/infra data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tracked files
        env:
          # Optional repository secret: newline-separated private regexes
          # (your domains, hostnames, names). Never committed.
          PUBLIC_SAFETY_DENYLIST: ${{ secrets.PUBLIC_SAFETY_DENYLIST }}
        run: python scripts/check_public_safety.py --all
      - name: Full history (content + commit emails)
        env:
          PUBLIC_SAFETY_DENYLIST: ${{ secrets.PUBLIC_SAFETY_DENYLIST }}
        run: python scripts/check_public_safety.py --history

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck skill/bitwarden/scripts/* install.sh tests/fixtures/fake-bw/bw
      - uses: astral-sh/setup-uv@v6
      - name: ruff
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Validate SKILL.md frontmatter
        run: uv run --no-project python scripts/validate_skill.py skill/bitwarden

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install bats and jq
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install bats-core jq; else sudo apt-get update && sudo apt-get install -y bats jq; fi
      - name: Shell tests (bats)
        run: bats tests/bats
      - name: Python tests
        run: uv run --group dev pytest -q
      - name: Build wheel and check bundled skill
        run: |
          uv build
          python3 -m zipfile -l dist/*.whl | grep -q "skill_bitwarden/_skill/bitwarden/SKILL.md"
